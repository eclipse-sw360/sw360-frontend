name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm-setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # Pinned to 11.11.0: A bare "11" resolves to 11.12.0, whose self-installer
          # crashes action-setup with "Cannot use 'in' operator to search for
          # 'integrity' in undefined". Need to Bump once pnpm/action-setup#276 is fixed upstream.
          version: 11.11.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # See here for caching with `yarn`, `bun` or other package managers https://github.com/actions/cache/blob/main/examples.md or you can leverage caching with actions/setup-node https://github.com/actions/setup-node
          path: |
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: 📦 Install dependencies
        shell: bash
        run: |
          pnpm i

      - name: Check client directives
        shell: bash
        run: |
          pnpm check:client-directives

      - name: Run linting
        shell: bash
        run: |
          pnpm biome ci --reporter=github | tee biome_output.txt

          # Append output to GitHub summary
          {
            echo "## 🧹 Biome Report"
            echo ""
            echo '```'
            cat biome_output.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Run build
        shell: bash
        run: |
          pnpm build --experimental-analyze --turbo --profile

      - name: Create Deploy Tarball
        shell: bash
        run: |
          pnpm pack --pack-destination dist

      - name: Create GH release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/sw360-frontend-*.tgz
